version: v2
managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: dj/gen/go
plugins:
  - remote: buf.build/protocolbuffers/go
    out: gen/go
    opt: paths=source_relative
  - remote: buf.build/connectrpc/go
    out: gen/go
    opt: paths=source_relative
  # Web client generation (enable when web/ app is started):
  # - remote: buf.build/connectrpc/es
  #   out: gen/ts
  #   opt: target=ts
  # - remote: buf.build/bufbuild/es
  #   out: gen/ts
  #   opt: target=ts
inputs:
  - directory: proto
